[project]
name = "open-ai-machine"
version = "0.1.0"
description = "Entorno Python unico del repo (uv). Usado por tools/build-template, por tools/convert-inputs y por el pandoc empaquetado via pypandoc-binary."
requires-python = ">=3.13,<3.14"
dependencies = [
    "markitdown[all]>=0.1.2",
    "pypandoc-binary>=1.17",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["tools/convert-inputs"]
testpaths = ["tools"]
