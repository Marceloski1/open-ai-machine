name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 9
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile
      - name: Install Python dependencies (uv)
        run: uv sync
      - name: Check forbidden lockfiles
        run: bun run tools/build-registry/src/check-lockfiles.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Run tests
        run: pnpm test
      - name: Build machine-core tool bundle
        run: bun run packages/node/machine-core/scripts/build-tool.ts
      - name: Check machine-core tool bundle is up to date
        run: git diff --exit-code packages/node/machine-core/tools/machine.js
      - name: Build machine-business tool bundle
        run: bun run packages/node/machine-business/scripts/build-tool.ts
      - name: Check machine-business tool bundle is up to date
        run: git diff --exit-code packages/node/machine-business/tools/machine_business.js
      - name: Build machine-discovery tool bundle
        run: bun run packages/node/machine-discovery/scripts/build-tool.ts
      - name: Check machine-discovery tool bundle is up to date
        run: git diff --exit-code packages/node/machine-discovery/tools/machine_discovery.js
      - name: Build registry
        run: bun run tools/build-registry/src/index.ts
      - name: Check registry is up to date
        run: git diff --exit-code registry/index.json
      # El CLI se ejecuta con Bun (usa Bun.file), no con Node. pnpm queda para las
      # dependencias del workspace; la instalacion se valida con el binario real.
      - name: Validate installation end to end (Bun)
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cli="$GITHUB_WORKSPACE/cli/src/cli.ts"
          cd "$workdir"

          test "$(bun "$cli" install machine-core --yes)" = "installed"
          test -f .opencode/commands/machine-process-input.md
          test -f .opencode/agents/machine.md
          test -f .opencode/templates/reference.docx
          test -f .opencode/tools/machine.js
          test -f .opencode/installed.json
          test ! -f opencode.json

          test "$(bun "$cli" install machine-core --yes)" = "unchanged"
          test "$(bun "$cli" uninstall machine-core)" = "removed"
          test ! -f .opencode/commands/machine-process-input.md

          test "$(bun "$cli" install machine-business --yes)" = "installed"
          test -f .opencode/commands/machine-business-init.md
          test -f .opencode/agents/machine-business.md
          test -f .opencode/tools/machine_business.js

          test "$(bun "$cli" install machine-business --yes)" = "unchanged"
          test "$(bun "$cli" uninstall machine-business)" = "removed"
          test ! -f .opencode/commands/machine-business-init.md
          test ! -f .opencode/tools/machine_business.js

          test "$(bun "$cli" install machine-discovery --yes)" = "installed"
          test -f .opencode/commands/machine-discovery-init.md
          test -f .opencode/agents/machine-discovery.md
          test -f .opencode/tools/machine_discovery.js

          test "$(bun "$cli" install machine-discovery --yes)" = "unchanged"
          test "$(bun "$cli" uninstall machine-discovery)" = "removed"
          test ! -f .opencode/commands/machine-discovery-init.md
          test ! -f .opencode/tools/machine_discovery.js
